<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Cụm dây lá cho góc khung. Đặt ở góc trên-trái; góc dưới-phải dùng lại file này
    và xoay 180° bằng CSS.
  -->
  <defs>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8ce6b"/>
      <stop offset="1" stop-color="#5f8f38"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8cbb54"/>
      <stop offset="1" stop-color="#4a7a2e"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe6cf"/>
    </radialGradient>
  </defs>

  <!-- Thân dây: một cung ôm góc, hai nhánh chạy dọc hai cạnh, hai tua cuốn -->
  <g fill="none" stroke="#5d8a37" stroke-width="4" stroke-linecap="round">
    <path d="M14 66C14 38 38 14 66 14"/>
    <path d="M66 14c18-3 30 6 48 3"/>
    <path d="M14 66c-3 18 6 30 3 48"/>
  </g>
  <g fill="none" stroke="#6d9a42" stroke-width="3.2" stroke-linecap="round">
    <path d="M96 16c5 5 4 11-1 12s-7-5-3-9"/>
    <path d="M16 96c5 5 11 4 12-1s-5-7-9-3"/>
    <path d="M40 24c-4-6-3-12 2-15"/>
  </g>

  <!-- Lá: mỗi lá có gân giữa để không bị bẹt -->
  <g stroke="#3f6b28" stroke-width="2.2" stroke-linejoin="round">
    <g fill="url(#leafA)">
      <path d="M74 8c11-9 25-8 33 3-10 10-24 9-33-3z"/>
      <path d="M8 74c-9 11-8 25 3 33 10-10 9-24-3-33z"/>
    </g>
    <g fill="url(#leafB)">
      <path d="M46 20c8-7 19-6 25 2-7 8-18 7-25-2z"/>
      <path d="M20 46c-7 8-6 19 2 25 8-7 7-18-2-25z"/>
      <path d="M110 22c7-5 15-3 19 4-7 6-15 4-19-4z"/>
      <path d="M22 110c-5 7-3 15 4 19 6-7 4-15-4-19z"/>
    </g>
  </g>
  <g fill="none" stroke="#3f6b28" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M76 10c10 0 20 1 29 3"/>
    <path d="M10 76c0 10 1 20 3 29"/>
    <path d="M48 21c8 0 15 1 21 3"/>
    <path d="M21 48c0 8 1 15 3 21"/>
  </g>

  <!-- Hoa lớn ở đỉnh góc -->
  <g stroke="#cdb98a" stroke-width="2">
    <g fill="url(#petal)">
      <circle cx="26" cy="15" r="12"/>
      <circle cx="44" cy="24" r="12"/>
      <circle cx="39" cy="44" r="12"/>
      <circle cx="18" cy="41" r="12"/>
      <circle cx="10" cy="24" r="12"/>
    </g>
    <circle cx="27" cy="29" r="6.5" fill="#f2b529"/>
  </g>
  <!-- Hoa nhỏ phụ, lệch nhịp cho cụm không đối xứng cứng -->
  <g stroke="#cdb98a" stroke-width="1.6">
    <g fill="url(#petal)">
      <circle cx="66" cy="6" r="6.4"/>
      <circle cx="75" cy="10" r="6.4"/>
      <circle cx="72" cy="19" r="6.4"/>
      <circle cx="62" cy="17" r="6.4"/>
      <circle cx="59" cy="10" r="6.4"/>
    </g>
    <circle cx="67" cy="12.5" r="3.4" fill="#f2b529"/>
  </g>
</svg>
