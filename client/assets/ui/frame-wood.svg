<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!--
    Khung gỗ dùng cho CSS border-image (9-slice, slice = 40).
    Bố cục theo lát cắt:
      - góc  : bo tròn, vân gỗ cong theo góc
      - cạnh : vân thẳng, kéo giãn mượt (border-image-repeat: stretch)
      - giữa : bị bỏ đi (không dùng từ khoá fill), để lộ nội dung bên dưới
  -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#e0bd90"/>
      <stop offset="0.34" stop-color="#c79a68"/>
      <stop offset="0.68" stop-color="#b0824f"/>
      <stop offset="1" stop-color="#8d6238"/>
    </linearGradient>

    <!-- Vân gỗ: nhiễu mềm kéo dài theo một trục, giữ ở mức rất nhẹ để không bẩn khung -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22" intercept="0"/>
      </feComponentTransfer>
    </filter>

    <clipPath id="band">
      <path d="M2 32C2 15.4 15.4 2 32 2h96c16.6 0 30 13.4 30 30v96c0 16.6-13.4 30-30 30H32c-16.6 0-30-13.4-30-30z
               M34 46v68c0 6.6 5.4 12 12 12h68c6.6 0 12-5.4 12-12V46c0-6.6-5.4-12-12-12H46c-6.6 0-12 5.4-12 12z"
            clip-rule="evenodd"/>
    </clipPath>
  </defs>

  <!-- Thân khung -->
  <rect x="2" y="2" width="156" height="156" rx="30" fill="url(#wood)"/>

  <!-- Vân gỗ, chỉ phủ trong dải khung -->
  <g clip-path="url(#band)">
    <rect x="0" y="0" width="160" height="160" filter="url(#grain)" opacity="0.5"/>
    <g fill="none" stroke="#8a5b2f" stroke-opacity="0.28" stroke-width="1.4">
      <rect x="9" y="9" width="142" height="142" rx="24"/>
      <rect x="15" y="15" width="130" height="130" rx="20"/>
      <rect x="22" y="22" width="116" height="116" rx="16"/>
      <rect x="28" y="28" width="104" height="104" rx="13"/>
    </g>
  </g>

  <!-- Viền ngoài và viền trong -->
  <rect x="2" y="2" width="156" height="156" rx="30" fill="none" stroke="#6b4726" stroke-width="5"/>
  <rect x="34" y="34" width="92" height="92" rx="14" fill="none" stroke="#6b4726" stroke-width="5"/>

  <!-- Gờ vát: sáng ở mép ngoài, tối ở mép trong, cho khung có khối -->
  <rect x="7.5" y="7.5" width="145" height="145" rx="26" fill="none" stroke="#f2d9b4" stroke-opacity="0.6" stroke-width="2.6"/>
  <rect x="30.5" y="30.5" width="99" height="99" rx="16" fill="none" stroke="#5b3c1f" stroke-opacity="0.35" stroke-width="2.2"/>

</svg>
