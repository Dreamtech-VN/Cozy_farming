<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2d4a3e" />
  <title>2D Social MMO — Farming + Social + Match-3</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="Thế giới game"></canvas>

    <!-- HUD (doc 12 — world là trung tâm, UI là overlay) -->
    <header id="hud" class="hidden">
      <!-- Trái: nhân vật, ví tiền, bảng nhiệm vụ -->
      <div class="hud-left">
        <!-- Nhân vật và ví nằm CHUNG một tấm nền: ba tấm rời như bản trước làm
             góc trái vụn thành mấy mảng xám không liên quan gì nhau. -->
        <div class="hud-identity">
        <button id="player-card" type="button" aria-label="Mở thông tin nhân vật">
          <span class="portrait">
            <canvas id="avatar-portrait" width="176" height="176"></canvas>
            <span class="level-star">
              <svg viewBox="0 0 48 46" aria-hidden="true">
                <path d="M24 2l6.2 15.5 16.6 1.1L34 29.4l4.1 16.1L24 36.4 9.9 45.5 14 29.4 1.2 18.6l16.6-1.1z"
                      fill="url(#starFill)" stroke="#b8791a" stroke-width="2.6" stroke-linejoin="round"/>
                <defs>
                  <linearGradient id="starFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffe98a"/>
                    <stop offset="0.55" stop-color="#f9c93f"/>
                    <stop offset="1" stop-color="#e8a218"/>
                  </linearGradient>
                </defs>
              </svg>
              <span class="lv-value" id="hud-level">1</span>
            </span>
          </span>
          <span class="banner">
            <span class="name" id="hud-name">—</span>
            <span class="banner-bottom">
              <span class="xp-bar"><span class="xp-fill" id="hud-xp-fill"></span></span>
              <span class="xp-text" id="hud-xp">0 / 0</span>
            </span>
          </span>
        </button>

        <div class="hud-wallet">
          <div class="pill currency" id="hud-coin"><span class="dot coin"></span><span>0</span></div>
          <div class="pill currency" id="hud-gem"><span class="dot gem"></span><span>0</span></div>
          <button class="wallet-add" id="wallet-add" type="button" aria-label="Tới cửa hàng">+</button>
        </div>
        </div>

        <!-- Bảng nhiệm vụ: tab theo loại, thu gọn được. Nội dung dựng ở
             client/src/ui/quest_tracker.js -->
        <section id="quest-tracker" class="hidden" aria-label="Nhiệm vụ đang làm"></section>
      </div>

      <!-- Phải: lưới nút chức năng -->
      <div class="hud-right">
        <nav id="menu-top" class="icon-grid" aria-label="Chức năng"></nav>
      </div>
    </header>

    <!-- Góc dưới phải: các nút dùng nhiều nhất -->
    <nav id="menu-bottom" class="icon-row hidden" aria-label="Truy cập nhanh"></nav>

    <!-- Dưới giữa: khung chat cố định -->
    <section id="chat-dock" class="hidden" aria-label="Trò chuyện">
      <!-- Dòng chat trôi thẳng trên nền thế giới, chỉ hàng nhập mới có tấm nền:
           một hộp nền cao 76px lúc chưa ai nói gì chỉ là mảng trống che mất cảnh. -->
      <div id="chat-stream" aria-live="polite"></div>
      <form id="chat-entry" autocomplete="off">
        <select id="chat-scope" aria-label="Kênh chat">
          <option value="map">Khu này</option>
          <option value="world">Thế giới</option>
        </select>
        <input id="chat-input" type="text" maxlength="200" placeholder="Nhập nội dung…" />
        <button class="chat-tool" id="chat-emote" type="button" aria-label="Biểu cảm" title="Biểu cảm">☺</button>
        <button class="primary" type="submit">Gửi</button>
      </form>
    </section>

    <div id="interact-hint" class="hidden"></div>
    <div id="toast-stack"></div>
    <div id="panels"></div>
    <div id="overlay" class="hidden"></div>

    <div id="connection" class="hidden">Mất kết nối — đang thử lại…</div>

    <!-- Game chơi ở màn hình ngang; màn dọc chỉ nhắc xoay máy. -->
    <div id="rotate-notice">
      <div>
        <strong>Xoay ngang màn hình</strong>
        <p>Thế giới 2D side-view hiển thị theo chiều ngang.</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
