<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2d4a3e" />
  <title>2D Social MMO — Farming + Social + Match-3</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="Thế giới game"></canvas>

    <!-- HUD (doc 12 — world là trung tâm, UI là overlay) -->
    <header id="hud" class="hidden">
      <!-- Trái: thông tin nhân vật (khung gỗ, nền giấy) -->
      <div class="hud-left">
        <button id="player-card" type="button" aria-label="Mở thông tin nhân vật">
          <span class="portrait">
            <canvas id="avatar-portrait" width="176" height="176"></canvas>
            <svg class="portrait-leaves" viewBox="0 0 54 34" aria-hidden="true">
              <path d="M26 9c-7-6-17-6-24 1 6 7 17 8 24 1z" fill="#7fae4e" stroke="#4f7a34" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M2 10c7-1 15 0 24-1" stroke="#4f7a34" stroke-width="1.4" fill="none" stroke-linecap="round"/>
              <path d="M30 30c-6-5-15-5-21 1 6 6 15 6 21-1z" fill="#96c45f" stroke="#4f7a34" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M9 31c6-1 13 0 21-1" stroke="#4f7a34" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            </svg>
          </span>

          <span class="banner">
            <span class="banner-top">
              <span class="name" id="hud-name">—</span>
              <svg class="vine" viewBox="0 0 210 34" aria-hidden="true">
                <path d="M2 20C34 6 64 30 100 17s70-16 108 2" fill="none" stroke="#9a7a45" stroke-width="3.2" stroke-linecap="round"/>
                <g fill="#8fbb56" stroke="#557f37" stroke-width="1.3">
                  <ellipse cx="30" cy="8" rx="11" ry="6.4" transform="rotate(-24 30 8)"/>
                  <ellipse cx="58" cy="26" rx="10" ry="6" transform="rotate(18 58 26)"/>
                  <ellipse cx="128" cy="7" rx="11" ry="6.4" transform="rotate(-16 128 7)"/>
                  <ellipse cx="160" cy="24" rx="10" ry="6" transform="rotate(22 160 24)"/>
                  <ellipse cx="196" cy="9" rx="10" ry="6" transform="rotate(-28 196 9)"/>
                </g>
                <g stroke="#c9b98f" stroke-width="1">
                  <g fill="#fffdf6">
                    <circle cx="88" cy="14" r="4.4"/><circle cx="96" cy="11" r="4.4"/>
                    <circle cx="99" cy="19" r="4.4"/><circle cx="91" cy="22" r="4.4"/>
                    <circle cx="84" cy="20" r="4.4"/>
                  </g>
                  <circle cx="91.5" cy="17" r="2.6" fill="#f2c94c"/>
                </g>
              </svg>
            </span>

            <span class="banner-bottom">
              <span class="level-star">
                <svg viewBox="0 0 48 46" aria-hidden="true">
                  <path d="M24 2l6.2 15.5 16.6 1.1L34 29.4l4.1 16.1L24 36.4 9.9 45.5 14 29.4 1.2 18.6l16.6-1.1z"
                        fill="#f7cf4f" stroke="#c68d20" stroke-width="2.4" stroke-linejoin="round"/>
                </svg>
                <span class="lv-stack">
                  <span class="lv-text">Lv.</span>
                  <span class="lv-value" id="hud-level">1</span>
                </span>
              </span>
              <span class="xp-bar"><span class="xp-fill" id="hud-xp-fill"></span></span>
              <span class="xp-text" id="hud-xp">0 / 0</span>
            </span>
          </span>
        </button>
      </div>

      <!-- Giữa: tiền tệ -->
      <div class="hud-center">
        <div class="pill currency" id="hud-coin"><span class="dot coin"></span><span>0</span></div>
        <div class="pill currency" id="hud-gem"><span class="dot gem"></span><span>0</span></div>
      </div>

      <!-- Phải: minimap + chọn khu -->
      <div class="hud-right">
        <button id="minimap" type="button" aria-label="Mở bản đồ khu vực">
          <span class="minimap-frame">
            <canvas id="minimap-canvas" width="360" height="150"></canvas>
            <span class="minimap-label" id="hud-map">—</span>
          </span>
          <svg class="corner-vine tl" viewBox="0 0 96 96" aria-hidden="true">
            <g fill="none" stroke="#5f8c3a" stroke-width="3.4" stroke-linecap="round">
              <path d="M10 50C10 27 27 10 50 10"/>
              <path d="M50 10c16-2 26 5 42 3"/>
              <path d="M10 50c-2 16 5 26 3 42"/>
              <path d="M74 13c4 5 3 9-1 10s-6-4-3-7"/>
              <path d="M13 74c5 4 9 3 10-1s-4-6-7-3"/>
            </g>
            <g fill="#7fae4e" stroke="#4f7a34" stroke-width="2.2" stroke-linejoin="round">
              <path d="M56 6c9-7 20-6 27 2-8 8-19 8-27-2z"/>
              <path d="M6 56c-7 9-6 20 2 27 8-8 8-19-2-27z"/>
              <path d="M34 14c7-6 16-5 22 1-6 7-16 7-22-1z"/>
            </g>
            <g stroke="#cbb98d" stroke-width="1.6">
              <g fill="#fffdf6">
                <circle cx="20" cy="14" r="9"/><circle cx="34" cy="20" r="9"/>
                <circle cx="30" cy="35" r="9"/><circle cx="14" cy="33" r="9"/>
                <circle cx="8" cy="20" r="9"/>
              </g>
              <circle cx="21" cy="24" r="5" fill="#f2b529"/>
            </g>
          </svg>
          <svg class="corner-vine br" viewBox="0 0 96 96" aria-hidden="true">
            <g fill="none" stroke="#5f8c3a" stroke-width="3.4" stroke-linecap="round">
              <path d="M10 50C10 27 27 10 50 10"/>
              <path d="M50 10c16-2 26 5 42 3"/>
              <path d="M10 50c-2 16 5 26 3 42"/>
              <path d="M74 13c4 5 3 9-1 10s-6-4-3-7"/>
              <path d="M13 74c5 4 9 3 10-1s-4-6-7-3"/>
            </g>
            <g fill="#7fae4e" stroke="#4f7a34" stroke-width="2.2" stroke-linejoin="round">
              <path d="M56 6c9-7 20-6 27 2-8 8-19 8-27-2z"/>
              <path d="M6 56c-7 9-6 20 2 27 8-8 8-19-2-27z"/>
              <path d="M34 14c7-6 16-5 22 1-6 7-16 7-22-1z"/>
            </g>
            <g stroke="#cbb98d" stroke-width="1.6">
              <g fill="#fffdf6">
                <circle cx="20" cy="14" r="9"/><circle cx="34" cy="20" r="9"/>
                <circle cx="30" cy="35" r="9"/><circle cx="14" cy="33" r="9"/>
                <circle cx="8" cy="20" r="9"/>
              </g>
              <circle cx="21" cy="24" r="5" fill="#f2b529"/>
            </g>
          </svg>
        </button>
        <button id="channel-button" type="button" aria-label="Chuyển khu">
          <span class="channel-label">Khu</span>
          <span class="channel-value" id="channel-value">1</span>
          <span class="channel-load" id="channel-load">0/40</span>
          <svg class="channel-caret" viewBox="0 0 12 8" aria-hidden="true">
            <path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <nav id="toolbar" class="hidden">
      <button data-panel="quests" type="button">Nhiệm vụ</button>
      <button data-panel="inventory" type="button">Túi đồ</button>
      <button data-panel="farm" type="button">Nông trại</button>
      <button data-panel="social" type="button">Bạn bè</button>
      <button data-panel="chat" type="button">Chat</button>
      <button data-panel="profile" type="button">Nhân vật</button>
    </nav>

    <div id="interact-hint" class="hidden"></div>
    <div id="toast-stack"></div>
    <div id="panels"></div>
    <div id="overlay" class="hidden"></div>

    <div id="connection" class="hidden">Mất kết nối — đang thử lại…</div>

    <!-- Game chơi ở màn hình ngang; màn dọc chỉ nhắc xoay máy. -->
    <div id="rotate-notice">
      <div>
        <strong>Xoay ngang màn hình</strong>
        <p>Thế giới 2D side-view hiển thị theo chiều ngang.</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
