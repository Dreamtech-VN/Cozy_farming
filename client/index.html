<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#2d4a3e" />
  <title>2D Social MMO — Farming + Social + Match-3</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="stage" aria-label="Thế giới game"></canvas>

    <!-- HUD (doc 12 — world là trung tâm, UI là overlay) -->
    <header id="hud" class="hidden">
      <!-- Trái: nhân vật, ví tiền, bảng nhiệm vụ -->
      <div class="hud-left">
        <!-- Khung avatar THÒ RA khỏi viên nang (cao hơn và lấn sang trái) đúng
             như mẫu; tên ở dòng trên, cấp + thanh XP ở dòng dưới. -->
        <button id="player-card" type="button" aria-label="Mở thông tin nhân vật">
          <span class="portrait">
            <canvas id="avatar-portrait" width="176" height="176"></canvas>
          </span>
          <span class="banner">
            <span class="name" id="hud-name">—</span>
            <span class="banner-bottom">
              <span class="lv-label" aria-label="Cấp"></span><b class="lv-value" id="hud-level">1</b>
              <!-- Số XP nằm TRÊN thanh như mẫu, không tách thành chữ rời bên phải. -->
              <span class="xp-bar">
                <span class="xp-fill" id="hud-xp-fill"></span>
                <span class="xp-text" id="hud-xp">0 / 0</span>
              </span>
            </span>
          </span>
        </button>

        <div class="hud-wallet">
          <div class="pill currency" id="hud-coin"><span class="dot coin"></span><span>0</span></div>
          <div class="pill currency" id="hud-gem"><span class="dot gem"></span><span>0</span></div>
          <button class="wallet-add" id="wallet-add" type="button" aria-label="Tới cửa hàng">+</button>
        </div>

        <!-- Bảng nhiệm vụ: tab theo loại, thu gọn được. Nội dung dựng ở
             client/src/ui/quest_tracker.js -->
        <section id="quest-tracker" class="hidden" aria-label="Nhiệm vụ đang làm"></section>
      </div>

      <!-- Phải: lưới nút chức năng -->
      <div class="hud-right">
        <nav id="menu-top" class="icon-grid" aria-label="Chức năng"></nav>
      </div>
    </header>

    <!-- Góc dưới phải: các nút dùng nhiều nhất -->
    <nav id="menu-bottom" class="icon-row hidden" aria-label="Truy cập nhanh"></nav>

    <!-- Dưới giữa: khung chat -->
    <section id="chat-dock" class="hidden" aria-label="Trò chuyện">
      <!-- Nút Bạn bè đứng RIÊNG bên trái khối chat, đúng vị trí 好友 trong mẫu.
           Nội dung nút dựng ở chat_dock.js để dùng chung icon với HUD. -->
      <button id="chat-friends" class="icon-btn" type="button"></button>
      <!-- Ba tầng dính liền thành một khối: hàng công cụ, khung tin, hàng nhập. -->
      <div class="chat-col">
        <div class="chat-tools">
          <button class="chat-tool" id="chat-emote" type="button"><span class="ct-ico e">☺</span>Biểu cảm</button>
        </div>
        <div id="chat-stream" aria-live="polite"></div>
        <form id="chat-entry" autocomplete="off">
          <button class="scope-pill" id="chat-scope" type="button" data-scope="map" aria-label="Đổi kênh chat">Khu</button>
          <input id="chat-input" type="text" maxlength="200" placeholder="Nhập nội dung…" />
          <button class="primary" type="submit" aria-label="Gửi">↵</button>
        </form>
      </div>
    </section>

    <div id="interact-hint" class="hidden"></div>
    <div id="toast-stack"></div>
    <div id="panels"></div>
    <div id="overlay" class="hidden"></div>

    <div id="connection" class="hidden">Mất kết nối — đang thử lại…</div>

    <!-- Game chơi ở màn hình ngang; màn dọc chỉ nhắc xoay máy. -->
    <div id="rotate-notice">
      <div>
        <strong>Xoay ngang màn hình</strong>
        <p>Thế giới 2D side-view hiển thị theo chiều ngang.</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
